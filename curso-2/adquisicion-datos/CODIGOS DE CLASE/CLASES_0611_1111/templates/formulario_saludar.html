<!DOCTYPE html>
<html>

<head>
    <title>Formulario Saludos</title>
</head>

<body>
        <h1>Saludar</h1>

        <form action="/saludar" method="post">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required><br>

            <label for="greeting">Saludo:</label>
            <input type="text" id="greeting" name="greeting" required><br>

            <input type="submit" value="Submit">
        </form>

</body>

</html>
